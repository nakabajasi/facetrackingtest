<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Reality AR Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    main {
      width: min(92vw, 520px);
      padding: 32px 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.7;
      color: #555;
    }

    .ar-button {
      display: inline-block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>
  <main>
    <h1>AR表示テスト</h1>

    <p>
      下のボタンをタップして、Reality Composerで作成した
      ARコンテンツを開きます。
    </p>

    <a class="ar-button" rel="ar" href="scene.reality">
      ARで開く
    </a>

    <div class="note">
      iPhone / iPad のSafariでお試しください。
    </div>
  </main>
</body>
</html>
